<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — Messenger</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="chat-wrapper">
    <!-- Левая панель: контакты -->
    <div class="contacts-panel">
        <div class="header">
            <h2>Чаты</h2>
            <div style="display:flex; gap:8px;">
                <button type="button" id="profile-btn" class="profile-btn" title="Мой профиль" onclick="openMyProfile()">👤</button>
                <button id="logout-btn" class="profile-btn" title="Выйти">🚪</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск...">
            <button id="search-btn">🔍</button>
        </div>
        <div id="user-list" class="user-list"></div>
    </div>

    <!-- Правая панель: чат -->
    <div class="chat-panel">
        <div id="chat-header" class="chat-header">
            <div class="avatar" id="chat-header-avatar">👤</div>
            <div class="info">
                <div class="name" id="chat-header-name">Выберите собеседника</div>
                <div class="status" id="chat-header-status">Не подключено</div>
            </div>
        </div>

        <div id="chat-messages" class="messages-area">
            <div class="empty-chat">Выберите чат, чтобы начать общение</div>
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." >
            <button id="send-btn">Отправить</button>
        </div>
    </div>
</div>

<div id="profile-modal" class="modal-overlay">
    <div class="modal">
        <button class="close-btn" onclick="closeProfileModal()">✕</button>
        <h2 id="modal-title">Профиль пользователя</h2>
        <div id="profile-modal-content"></div>
    </div>
</div>

<script src="/js/chat.js"></script>
</body>
</html>
