<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<div class="container">

    <h1>Messenger</h1>

    <h2>Регистрация</h2>


    <input id="username"
           type="text"
           placeholder="Username">


    <input id="email"
           type="email"
           placeholder="Email">


    <input id="password"
           type="password"
           placeholder="Password">


    <button onclick="register()">
        Зарегистрироваться
    </button>


    <p>
        Уже есть аккаунт?
        <a href="login.html">
            Войти
        </a>
    </p>


</div>


<script src="js/register.js"></script>

</body>
</html>
